        <div
            x-show="needsPermission"
            x-transition.opacity
            class="mt-6 rounded-xl border border-[oklch(40%_0.09_300_/0.6)]
                            bg-black/40 p-4 text-sm text-[oklch(88%_0.02_300)]"
        >
            <p>
                Enable motion access to make the background react to device
                movement.
            </p>
            <button
                @click="requestPermission()"
                class="mt-3 inline-flex items-center gap-2 rounded-lg
                                border border-[oklch(40%_0.09_300_/0.7)]
                                px-3 py-1.5 text-sm font-medium
                                text-[oklch(92%_0.02_300)]
                                transition-colors hover:bg-[oklch(35%_0.08_300_/0.6)]
                                focus:outline-none focus-visible:ring-2
                                focus-visible:ring-[oklch(70%_0.10_300_/0.7)]"
                type="button"
            >
                Enable motion
            </button>
        </div>
    </section>
</main>
</div>
</body>
</html>
